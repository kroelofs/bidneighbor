name: Deploy

on:
  push:
    branches: [main]

# Latest push wins; cancel superseded deploys.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build web assets
        run: npm run build

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply bidneighbor --remote --config cloud/wrangler.toml

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: >-
            deploy --config cloud/wrangler.toml
            --var GIT_SHA:${{ github.sha }}
            --var DEPLOYED_AT:${{ github.run_id }}
