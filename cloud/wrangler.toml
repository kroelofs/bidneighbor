name = "bidneighbor"
main = "worker/src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
# Pinned so CI/deploy doesn't call /memberships (an account-scoped API token
# can't list user memberships — that returns code 9106). Not sensitive.
account_id = "7b18c4252596092391086feef44012e0"

# Static frontend assets (output of `npm run build:web` → cloud/public).
# The Worker runs first; non-/api requests fall through to asset serving + SPA shells.
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
APP_BASE_URL = "https://app.bidneighbor.com"
EMAIL_FROM = "BidNeighbor <no-reply@bidneighbor.com>"
APP_HOST = "app.bidneighbor.com"
# Legacy admin subdomain — the Worker only uses it to 302-redirect old admin.* links
# to app.bidneighbor.com/admin (admin is now a route in the single app SPA).
ADMIN_HOST = "admin.bidneighbor.com"

[[d1_databases]]
binding = "DB"
database_name = "bidneighbor"
database_id = "d4d4de60-e6b8-4de3-b6a7-f8fff9f3ba75"
migrations_dir = "d1"

[[r2_buckets]]
binding = "TASK_UPLOADS"
bucket_name = "bidneighbor-uploads"

[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "6d10a652b0cf48e987aef6ad13433b0e"

[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "bidneighbor-notifications"

[[queues.consumers]]
queue = "bidneighbor-notifications"
max_batch_size = 10
max_retries = 3

# Daily image retention sweep (see worker/src/cron.ts): R2 Standard -> Infrequent
# Access at 30 days, delete at 90 days.
[triggers]
crons = ["0 4 * * *"]

# Production routes are managed MANUALLY in the Cloudflare dashboard
# (Workers Routes → `*.bidneighbor.com/*` → bidneighbor), NOT here. The deploy
# API token is an account-scoped token without Zone→Workers Routes:Edit, so
# wrangler cannot reconcile routes — listing them here makes every deploy fail at
# the route step. The dashboard wildcard route covers app. + admin. (the Worker
# routes by Host header). If the token later gains Zone Workers Routes:Edit on the
# bidneighbor.com zone, these can be restored:
#   [[routes]]
#   pattern = "app.bidneighbor.com/*"
#   zone_name = "bidneighbor.com"
#   [[routes]]
#   pattern = "admin.bidneighbor.com/*"
#   zone_name = "bidneighbor.com"

# Runtime secrets (set with `wrangler secret put <NAME>`):
#   TURNSTILE_SECRET_KEY
#   EMAIL_API_KEY                (Resend)
#   GOOGLE_OAUTH_CLIENT_ID
#   GOOGLE_OAUTH_CLIENT_SECRET
#   SESSION_SIGNING_KEY          (random 32+ bytes)
